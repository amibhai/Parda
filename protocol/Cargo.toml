[package]
name        = "parda-protocol"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
description = "PARDA cryptographic protocol layer — libsignal-protocol wrapper"

# ─── Signal Foundation's Rust implementation of the Signal Protocol.
# Pin the tag to a specific audited release; never float this dependency.
# Build requirements: Rust ≥ 1.75, clang/LLVM, MSVC on Windows.
[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.66.0", package = "libsignal-protocol" }

async-trait = { workspace = true }
base64      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
zeroize     = { workspace = true }
rand        = "0.8"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Sub-Phase 2B: Sphinx packet format (Danezis & Goldberg, IEEE S&P 2009).
# Existing, production-used implementation (Nym Technologies mixnet) —
# not hand-rolled onion crypto, per the no-custom-crypto constraint this
# project already applies to the Signal Protocol layer. See
# protocol/src/mixnet.rs module docs.
sphinx-packet = "0.7"
x25519-dalek  = { version = "3.0", features = ["static_secrets", "getrandom", "zeroize"] }
# Phase 3 / Sub-Phase 3A: time-bound self-destruct key derivation and
# encryption. HKDF (RFC 5869) + ChaCha20-Poly1305 AEAD — both RustCrypto,
# no custom crypto. See docs/phase3-3a-self-destruct-design.md.
hkdf = "0.12"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# Sub-Phase 3A's expiry timer (`self_destruct::SelfDestructingMessage`)
# spawns a real background task and needs a timer — this makes tokio a
# real runtime dependency of the library itself, not just of tests/bins
# that happen to use one.
tokio       = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio-test  = "0.4"

[[test]]
name    = "crypto_tests"
path    = "tests/crypto_tests.rs"
