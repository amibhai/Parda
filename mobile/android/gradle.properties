org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# mobile_scanner (QR contact-card scanning) ships its own Kotlin Gradle
# Plugin, which Flutter's built-in Kotlin support warns about. In this
# combination the Kotlin incremental compiler fails to close its caches
# on Windows and the build dies with "Could not close incremental caches"
# before any real compilation error can surface. Disabling incremental
# Kotlin compilation costs rebuild speed and nothing else.
kotlin.incremental=false
