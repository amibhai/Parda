[package]
name        = "parda-relay"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
description = "PARDA relay server — dumb-pipe store-and-forward for encrypted envelopes"

[dependencies]
axum           = { version = "0.7", features = ["json", "macros"] }
tokio          = { workspace = true, features = ["full"] }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
uuid           = { workspace = true }
base64         = { workspace = true }
tower-http     = { version = "0.5", features = ["trace", "cors"] }
# Encrypted-at-rest store. `bundled-sqlcipher-vendored-openssl` compiles both
# SQLCipher and OpenSSL from source so no system SQLCipher/OpenSSL install is
# required — see server/src/store.rs module docs for the build prerequisite
# this still carries (a working Perl, for OpenSSL's Configure step).
rusqlite       = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
# Share envelope + prekey-bundle models with the protocol crate.
parda-protocol = { path = "../protocol" }

[dev-dependencies]
axum-test     = "14"
tokio         = { workspace = true, features = ["full"] }
