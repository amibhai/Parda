[workspace]
members  = ["protocol", "server", "mixnode"]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.75"
authors     = ["PARDA Engineering"]
license     = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1",    features = ["full"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1",    features = ["v4", "serde"] }
base64      = "0.22"
zeroize     = { version = "1.7",  features = ["derive"] }
async-trait = "0.1"
