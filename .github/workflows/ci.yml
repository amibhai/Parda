name: CI

# Runs the full workspace test suite on every push and pull request
# against main, plus a dedicated job for the forensic-recovery /
# memory-forensics tests (Sub-Phase 3C/3D — see that job's own comment
# for why it's separate). This was listed as planned for 0.1.0 and had
# not been wired up before Phase 2 — see CHANGELOG.md.
#
# Some crates in this workspace need native build tooling beyond a bare
# Rust toolchain:
#   - parda-protocol (and everything that depends on it) needs
#     libsignal-protocol's `protoc` for its protobuf types.
#   - parda-relay, parda-client-store, and parda-cli (which depends on
#     the client store) need `rusqlite`'s
#     `bundled-sqlcipher-vendored-openssl` feature (see
#     server/src/store.rs / client-store/src/lib.rs), which compiles
#     SQLCipher and OpenSSL from source and therefore needs a working
#     Perl (OpenSSL's Configure step) and a C toolchain. GitHub-hosted
#     ubuntu-latest and windows-latest runners ship both out of the box
#     — this is a local-dev-machine-only gotcha, see
#     docs/phase1-architecture.md §11.
#   - parda-mesh's `bluez` feature (Sub-Phase 4A's real BlueZ backend,
#     Linux-only) needs libdbus-1-dev at compile time. Not enabled by
#     default (see mesh/Cargo.toml) and not built by the plain
#     `cargo build --workspace` below; only the mesh-adversarial job
#     builds it, on ubuntu-latest only — see that job's own comment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # rust-cache and cargo both benefit from a stable target dir per-OS.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc + clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --verbose

      - name: cargo test --workspace
        run: cargo test --workspace --verbose

  # Sub-Phase 3C/3D: the forensic-recovery and memory-forensics tests
  # (protocol/src/self_destruct.rs's inline zeroize tests, its
  # Linux-only /proc/self/mem scan, secure_memory.rs's mlock-accounting
  # and memory-pressure tests, and protocol/tests/forensic_recovery_tests.rs)
  # already run as part of `cargo test --workspace` above — this job
  # exists in addition to that, not instead of it, per the explicit
  # brief requirement not to let slower, more invasive memory-inspection
  # tests be implicitly deprioritized by living inside the general test
  # job. Scoped to parda-protocol only (that's where all of these live);
  # --test-threads=1 because memory-forensics assertions are sensitive
  # to what else is concurrently allocating in the same process.
  forensic-recovery:
    name: forensic-recovery tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc + clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Memory-forensics unit tests (self_destruct, secure_memory, clock_guard)
        # A single positional filter is all `cargo test` accepts, so this
        # is scoped by target (--lib) rather than a substring matching
        # multiple module names — parda-protocol's lib test suite is
        # small and entirely relevant here regardless.
        run: cargo test -p parda-protocol --lib -- --test-threads=1 --nocapture

      - name: Forensic-recovery capstone tests
        run: cargo test -p parda-protocol --test forensic_recovery_tests -- --test-threads=1 --nocapture

  # Phase 4: the passive-scanner, malicious-carrier, flood-resistance,
  # partition/rejoin, retrieval-pattern, and multi-node/hybrid-handoff
  # adversarial tests (parda-mesh) — isolated into their own job for the
  # same reason forensic-recovery is: these are the actual proof of this
  # phase's claims (see docs/phase4-4c-dead-drop-addressing-design.md and
  # docs/THREAT_MODEL.md §3.7), not incidental unit tests, and should not
  # be implicitly deprioritized by living inside the general fast test
  # job. Also covers `parda-mesh`'s `bluez` feature (Sub-Phase 4A's real
  # BlueZ backend) on ubuntu-latest only — Linux-only by construction
  # (bluer/BlueZ), and even there this only proves the backend compiles
  # against the real bluer API; no GitHub-hosted runner has a Bluetooth
  # radio, so advertise/scan/connect are never exercised against real RF
  # here — see mesh/src/radio/bluez.rs module docs.
  mesh-adversarial:
    name: mesh adversarial/simulation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc + clang + libdbus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libdbus-1-dev

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo test -p parda-mesh (simulated backend, all platforms)
        run: cargo test -p parda-mesh --verbose -- --test-threads=1

      - name: cargo check -p parda-mesh --features bluez (Linux only)
        if: runner.os == 'Linux'
        run: cargo check -p parda-mesh --features bluez --verbose

  # Sub-Phase 4.5A: the receive-path timing-correlation permutation test —
  # this sub-phase's actual deliverable gate, per the same standard
  # Sub-Phase 2B's send-path test and Phase 3's forensic-recovery tests
  # were already held to. Isolated into its own job for the same reason:
  # a statistical test that spins up real mix-node/relay daemons is
  # slower and more sensitive to host scheduling noise than the fast unit
  # suite, and should not be implicitly deprioritized by living inside it.
  receive-path-anonymity:
    name: receive-path timing correlation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc + clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Receive-path permutation test
        run: cargo test -p parda-mixnode --test receive_timing_correlation_tests --verbose

  # Sub-Phase 4.5D: the trust-bootstrapping MITM before/after tests —
  # this sub-phase's actual deliverable gate. Isolated for the same
  # reason forensic-recovery and receive-path-anonymity are: these are
  # the proof of a specific security claim (see
  # docs/phase4.5d-trust-bootstrapping-design.md §4), including the
  # deliberately-asserted *limitation* that a MITM at first contact still
  # succeeds, and should not be implicitly deprioritized by living only
  # inside the general test job.
  trust-bootstrapping:
    name: trust bootstrapping MITM tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc + clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: MITM before/after verification tests
        run: cargo test -p parda-protocol --test trust_bootstrapping_tests --verbose

      - name: Trust module unit tests (fingerprint symmetry, TOFU/Verified transitions)
        # Quoted: an unquoted `trust:: ` is a YAML mapping-value indicator,
        # not a test filter.
        run: "cargo test -p parda-protocol --lib trust:: --verbose"

  # Sub-Phase 4.5E: operational-hardening gates. Grouped into one job
  # (rather than three) because unlike the jobs above these are not each
  # a separate security *claim* — they are one set of hardening
  # mechanisms whose tests share a runner cheaply. Still isolated from
  # the general test job because the restart-survival suite writes real
  # SQLCipher database files and the TLS suite performs real handshakes
  # on real loopback sockets; both are slower and more environment-
  # sensitive than the fast unit suite.
  operational-hardening:
    name: operational hardening (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc + clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Self-destruct restart survival. Needs parda-client-store's
      # vendored SQLCipher/OpenSSL build, which requires a complete Perl
      # for OpenSSL's Configure step — present on both GitHub-hosted
      # runner images (see docs/phase1-architecture.md §11 for the
      # dev-machine gap this documents).
      - name: Self-destruct restart-survival tests
        run: cargo test -p parda-client-store --test restart_survival_tests --verbose

      - name: Combined-mode self-destruct tests
        run: cargo test -p parda-protocol --test self_destruct_tests --verbose

      # Real TLS handshakes against real loopback listeners — the reason
      # native rustls termination was chosen over a reverse-proxy
      # deployment note (see tls/src/lib.rs module docs).
      - name: TLS termination integration tests
        run: cargo test -p parda-tls --verbose

      - name: Gateway auth + rate-limiting tests
        run: cargo test -p parda-gateway --verbose

      - name: Mix-node identity persistence tests
        # Quoted for the same reason as the trust:: filter above.
        run: "cargo test -p parda-mixnode --lib identity:: --verbose"

  # The Android client. Added after making it usable on real hardware —
  # until then nothing in CI touched `mobile/` at all, so a Dart
  # compile error or a broken startup path could land unnoticed. The
  # Kotlin/Gradle build is deliberately *not* run here: it needs the
  # Android SDK plus a `cargo-ndk` cross-compile of parda-mobile-bridge,
  # which is a materially heavier job than this one, and its failure
  # modes are caught locally by anyone actually building the app.
  mobile-client:
    name: flutter analyze + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      # Covers the startup routing both ways — that an enrolled user is
      # never re-prompted (which would overwrite a working identity) and
      # that a fresh install reaches onboarding.
      - name: Widget tests
        working-directory: mobile
        run: flutter test
